spring.application.name=InventoryService
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/inventoryService?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vikash1234
spring.jpa.hibernate.ddl-auto=create-drop

server.port=8082
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

#Actuator prometeus endpoint
management.endpoints.web.exposure.include=prometheus