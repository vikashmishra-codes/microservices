spring.application.name=OrderService
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/orderService?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vikash1234
spring.jpa.hibernate.ddl-auto=update
server.port=8801
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
#for fixing the Eureka has registered your Order Service with that hostname DESKTOP-VIKASH.mshome.net
eureka.instance.prefer-ip-address=true

management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

#reselience properties
resilience4j.circuitbreaker.instances.inventory.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventory.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.inventory.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventory.automatic-transition-from-open-to-half-open-enabled=true

#reselience4J timeout scenario
resilience4j.timelimiter.instances.inventory.timeout-duration=3s

#reselience4J Rerty Properties
resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=5s

#Zipkin setup
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

#Kafka properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.vikash.OrderService.event.OrderPlacedEvent

#Actuator prometeus endpoint
management.endpoints.web.exposure.include=prometheus
